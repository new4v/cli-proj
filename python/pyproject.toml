[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "my-cli"
version = "1.0.0"
description = "A CLI tool boilerplate"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
my-cli = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
